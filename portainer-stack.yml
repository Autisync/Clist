# Portainer Stack definition for apps/api — the self-hosted-VPS equivalent
# of render.yaml (same Dockerfile, same required env vars, same persistent-
# disk caveat for the object store — see apps/api/HOSTING.md for the full
# reasoning behind every one of those, none of it is repeated here).
#
# Two ways to deploy this with Portainer:
#   1. Git-based stack (recommended, mirrors how Render reads render.yaml):
#      Portainer -> Stacks -> Add stack -> Repository -> point at this
#      repo/branch, Compose path: portainer-stack.yml. Portainer clones the
#      whole repo, so the build context below (".") correctly resolves to
#      the repo root -- required, same reason apps/api/Dockerfile's own
#      header comment gives (it reads 03-schema.sql/seed.sql from the repo
#      root, and this is an npm-workspaces monorepo).
#   2. Web editor: paste this file's contents into Portainer's stack editor
#      -- only works if Portainer is building on a machine that already has
#      this repo checked out at the path Portainer runs `docker build`
#      from, since a pasted-in compose file has no repo of its own to
#      clone. Prefer option 1 unless you have a specific reason not to.
#
# Either way, Portainer's own "Environment variables" section (shown when
# creating/editing the stack) is where you fill in the five values below --
# never commit real values into this file. Same values as Render's
# Blueprint prompts for for; see apps/api/HOSTING.md's env var table for
# what each one is.
#
# TLS/routing: the `labels:`/`networks:` blocks below ONLY do anything if
# the Traefik instance on your host actually has Docker-label service
# discovery enabled (`providers.docker` in its static config). This is NOT
# a safe default assumption -- confirmed the hard way against the real
# server this file targets: it copied an existing working container's
# `traefik.*` labels verbatim (right down to the same certresolver and
# entrypoint names) and deployed clean, joined the right network, correct
# labels by every `docker inspect` check -- and Traefik still 404'd every
# request, because that host's Traefik runs `providers: {file: {directory:
# /dynamic, watch: true}}` ONLY. No `providers.docker` section at all. Every
# existing service on that host (including the one whose labels got
# copied) is actually routed via a small YAML file in that watched
# directory, and its Docker labels are inert leftovers that do nothing.
#
# Before trusting the labels below, check which provider your Traefik
# actually uses:
#   docker inspect traefik --format '{{.Config.Cmd}}'   # find its --configFile
#   docker exec traefik cat /path/from/above             # read the static config
# If you see a `providers.docker` block: the labels below are correct as
# written (adjust the four `traefik.*` values to match your resolver/
# entrypoint names the same way, via `docker inspect <a working container>`
# for its labels). If you see `providers.file` instead (or no `docker`
# provider at all): delete the `labels:` block below (keep `networks:` --
# Traefik still needs to reach this container over that shared network
# either way) and instead drop a file into the host path behind that
# provider's `directory:` (find it via `docker inspect traefik --format
# '{{json .Mounts}}'`, looking for the mount whose Destination matches).
# Real, confirmed-working content for that file (adjust the Host() domain
# and, if you renamed the service below, the loadBalancer URL):
#
#   http:
#     routers:
#       fieldready-api:
#         rule: "Host(`your-domain-or-sslip.io-host`)"
#         entrypoints:
#           - websecure
#         tls:
#           certResolver: letsencrypt-http   # use whichever HTTP-01 resolver
#                                             # your traefik.yml defines --
#                                             # DNS-01 resolvers need your
#                                             # domain on that DNS provider,
#                                             # which a sslip.io host isn't.
#         service: fieldready-api
#     services:
#       fieldready-api:
#         loadBalancer:
#           servers:
#             - url: "http://fieldready-api:3001"   # compose service name --
#                                                    # resolves via Docker's
#                                                    # DNS on the shared
#                                                    # `proxy` network, no
#                                                    # port publishing needed.
#
# `watch: true` on the file provider means Traefik picks this up within
# seconds, no restart needed. Confirmed end-to-end: real Let's Encrypt cert
# issued, HTTPS request reached the real Fastify app (not just a health
# check -- a nonexistent route returned Fastify's own real 404 JSON body).
#
# No TLS/proxy setup at all yet, either kind? Delete the `labels:`/
# `networks:` blocks below and uncomment `ports: ["3001:3001"]` instead --
# that plain HTTP-on-a-bare-IP setup is what apps/api/HOSTING.md's own
# testing already proved works end to end, just without a real domain or
# TLS in front of it.
#
# HOST_DOMAIN below needs a real, publicly resolvable hostname pointed at
# this server's IP before Traefik can get a Let's Encrypt cert for it — a
# bare IP address doesn't work for that. No domain yet? A free
# https://sslip.io hostname (e.g. `<dashes-for-dots-IP>.sslip.io`, which
# resolves to exactly that IP with zero registration) works exactly the
# same as a real domain for this purpose — confirmed resolving correctly
# before this file ever assumed it would.

services:
  fieldready-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # No `ports:` mapping — Traefik reaches this container over the
    # `proxy` network by its internal port (3001) directly; publishing it
    # to the host too would mean an unauthenticated, un-TLS'd copy of the
    # same API sitting open on the internet right alongside the properly
    # proxied one, which defeats the point of adding Traefik at all.
    networks:
      - proxy
    # See the file header comment above before trusting these -- they only
    # do anything if your Traefik has providers.docker enabled. Keep
    # `networks:` above regardless of which provider your host uses.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.fieldready-api.rule=Host(`${HOST_DOMAIN}`)"
      - "traefik.http.routers.fieldready-api.entrypoints=websecure"
      - "traefik.http.routers.fieldready-api.tls=true"
      - "traefik.http.routers.fieldready-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fieldready-api.service=fieldready-api-svc"
      - "traefik.http.services.fieldready-api-svc.loadbalancer.server.port=3001"
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - FIELDREADY_RUNTIME_DIR=/data
      # Bare `- NAME` (no value) pulls from Portainer's own "Environment
      # variables" section for this stack, not from anything committed
      # here -- fill these in there, the same five values Render's
      # Blueprint prompts for.
      - SUPABASE_PROJECT_REF
      - SUPABASE_DB_PASSWORD
      - SUPABASE_DB_POOLER_HOST
      - SUPABASE_SERVICE_ROLE_KEY
      - SUPABASE_ANON_KEY
      # A real random value, not a guessable string -- generate one
      # yourself (e.g. `openssl rand -hex 32`) and set it in Portainer's
      # env vars, the same way Render's Blueprint generates one for you
      # instead of asking.
      - SESSION_JWT_SECRET
      # The real hostname Traefik routes to this service (see the file
      # header comment) -- e.g. 46-224-205-82.sslip.io. Also referenced
      # directly in the labels above via ${HOST_DOMAIN} substitution.
      - HOST_DOMAIN
      # Optional -- all four unset keeps using the deterministic fixture
      # OCR provider (apps/api/.env.example's own comment on this).
      - VERYFI_CLIENT_ID
      - VERYFI_CLIENT_SECRET
      - VERYFI_USERNAME
      - VERYFI_API_KEY
    volumes:
      - fieldready-api-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true

volumes:
  fieldready-api-objects:
    # Photos + generated REF PDFs -- same single-instance-only limitation
    # apps/api/HOSTING.md's §3 already documents for Render's disk: this
    # survives container restarts/redeploys, but a real S3/R2 swap
    # (object-store.ts's own comment) is still the eventual real fix, not
    # attempted here either.
